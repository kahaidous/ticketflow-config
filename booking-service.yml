# OpenFeign: The client calls "event-service" by name.
# Eureka resolves the name to an instance, and the load balancer picks one.
# Set EVENT_SERVICE_URL to bypass Eureka (e.g., http://localhost:8082 when
# only event-service runs locally). Empty = use the service name.
ticketflow:
  clients:
    event-service:
      url: ${EVENT_SERVICE_URL:}
  resilience:
    event-service:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 10s
      permitted-calls-in-half-open-state: 3
      time-limit: 4s

# Never wait forever for another service: without timeouts, one slow service
# can freeze this service too.
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            logger-level: full
            connect-timeout: 2000
            read-timeout: 3000
# Resilience (step-08): the Feign client of event-service goes through a Resilience4J circuit breaker.
# group.enabled = ONE circuit for the whole client, not one per method.
# The thresholds are in ticketflow.resilience.event-service.* (see EventServiceResilienceProperties).
      circuitbreaker:
        enabled: true
        group:
          enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
  jpa:
    hibernate: 
      ddl-auto: update


logging:
  level:
    com.ticketflow.bookingservice.clients.EventClient: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers,circuitbreakerevents